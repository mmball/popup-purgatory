name: CI

on:
  push:
  pull_request:

# A new push on the same branch cancels the run in progress (a hung renderer
# would otherwise sit there until GitHub's 6-hour limit).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7-stable

jobs:
  test:
    name: Lint, unit tests, bot runs, determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      - name: Lint, import, unit tests, bot smoke run, determinism
        run: tools/test.sh ./godot

      - name: JUnit report
        if: always()
        run: ./godot --headless --path . -s tests/run_tests.gd -- --junit=junit.xml >/dev/null 2>&1 || true

      - name: Bot batches and balance tables (greedy, random, heuristic driver)
        run: |
          tools/botrun.sh ./godot 5 greedy 100 3
          tools/botrun.sh ./godot 5 random 200 3
          python3 tools/policy_driver.py ./godot --backend heuristic --runs 5 --seed 300 --max-wave 3
          python3 tools/summarize_runs.py runs/*.jsonl | tee runs/summary.txt
          python3 tools/balance.py runs/*.jsonl --events runs/telemetry --markdown | tee runs/balance.md

      - name: Upload logs and run data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-runs
          path: |
            import.log
            tests.log
            smoke.log
            det_*.log
            junit.xml
            runs/

  screenshots:
    name: Screenshot regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} and a virtual display
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 libxcursor1 libxinerama1 libxrandr2 libxi6 >/dev/null

      - name: Render fixed UI states and compare against tests/screenshots
        timeout-minutes: 15
        run: tools/screenshot_check.sh ./godot

      - name: Upload rendered screens, diffs and render logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots/*.png
            screenshots/*.log
